<style>
  * { box-sizing: border-box; margin: 0; }
  :root { --bg: #f4f5f7; --fg: #1b1b1f; --card: #fff; --line: #d9dbe0; }

  a:hover { transform: translateY(-4px); border-color: currentColor; }
  a:focus-visible { outline: 3px solid #2a6fd6; outline-offset: 3px; }
  svg { width: 96px; height: 96px; }
  strong { font-size: 1.2rem; }
  @media (prefers-reduced-motion: reduce) { a { transition: none; } a:hover { transform: none; } }
</style>
